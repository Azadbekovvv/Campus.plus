<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Campus+ — Your university, in one place</title>
    <style>
        :root {
            --p: #5B21B6;
            --dp: #3B0764;
            --lp: #EDE9FE;
            --r: #DC2626;
            --lr: #FEE2E2;
            --bg: #F6F5FA;
            --c: #fff;
            --t: #171717;
            --m: #5f5a6e;
            --bd: #e6e2f0;
            --pt: #5B21B6;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #14101f;
                --c: #1f1a2e;
                --t: #f3f0fa;
                --m: #b4aec6;
                --bd: #352e4b;
                --lp: #2e2150;
                --lr: #4a1717;
                --r: #f87171;
                --pt: #c4b5fd
            }
        }

        :root[data-theme="dark"] {
            --bg: #14101f;
            --c: #1f1a2e;
            --t: #f3f0fa;
            --m: #b4aec6;
            --bd: #352e4b;
            --lp: #2e2150;
            --lr: #4a1717;
            --r: #f87171;
            --pt: #c4b5fd
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--t);
            font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        button,
        input {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer;
            border: 0;
            background: none;
            min-height: 44px
        }

        :focus-visible {
            outline: 3px solid #8b5cf6;
            outline-offset: 2px
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding-bottom: 96px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--dp);
            color: #fff
        }

        header h1 {
            font-size: 18px;
            margin: 0;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px
        }

        header small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            opacity: .8
        }

        .ib {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            color: #fff;
            font-size: 20px;
            position: relative
        }

        .ib:hover {
            background: #ffffff22
        }

        .badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--r);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            line-height: 18px
        }

        main {
            padding: 16px;
            display: grid;
            gap: 16px;
            animation: in .25s
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1
            }
        }

        h2 {
            font-size: 18px;
            margin: 0
        }

        h3 {
            margin: 0;
            font-size: 16px
        }

        .sec {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .link {
            color: var(--pt);
            font-weight: 600;
            padding: 0 8px;
            min-height: 44px
        }

        .card {
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px #3b076412
        }

        .cls {
            display: flex;
            gap: 16px;
            cursor: pointer;
            transition: .15s
        }

        .cls:hover {
            box-shadow: 0 4px 14px #5b21b633
        }

        .cls .tm {
            min-width: 52px;
            font-weight: 700;
            color: var(--pt)
        }

        .cls .tm small {
            display: block;
            color: var(--m);
            font-weight: 400
        }

        .cls.chg {
            border: 2px solid var(--r);
            background: linear-gradient(var(--lr), var(--c) 60%)
        }

        .cls.next {
            border-color: var(--p);
            box-shadow: 0 0 0 3px var(--lp)
        }

        .cls.done {
            opacity: .6
        }

        .tag {
            display: inline-block;
            background: var(--r);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: .4px
        }

        .tag.p {
            background: var(--p)
        }

        .tag.g {
            background: var(--lp);
            color: var(--pt)
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 22px;
            background: var(--lp);
            color: var(--pt);
            font-weight: 600;
            border: 1px solid transparent;
            margin: 4px 4px 0 0
        }

        .chip.on {
            background: var(--p);
            color: #fff
        }

        .chip.sm {
            min-height: 36px;
            padding: 0 12px
        }

        .btn {
            min-height: 48px;
            padding: 0 20px;
            border-radius: 12px;
            background: var(--p);
            color: #fff;
            font-weight: 600;
            width: 100%;
            transition: .15s
        }

        .btn:hover {
            background: var(--dp)
        }

        .btn.o {
            background: var(--c);
            color: var(--pt);
            border: 2px solid var(--p)
        }

        .hero {
            background: linear-gradient(135deg, var(--p), var(--dp));
            color: #fff;
            border: 0
        }

        .hero .tm {
            color: #fff
        }

        .hero .tm small {
            color: #ddd
        }

        .alert {
            background: var(--lr);
            border: 2px solid var(--r);
            color: var(--t);
            cursor: pointer;
            display: flex;
            gap: 12px;
            align-items: center;
            text-align: left;
            width: 100%
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px
        }

        .svc {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 88px;
            padding: 8px;
            border-radius: 16px;
            background: var(--c);
            border: 1px solid var(--bd);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 2px 8px #3b076412;
            transition: .15s
        }

        .svc:hover {
            background: var(--lp)
        }

        .svc span {
            font-size: 26px
        }

        .grid.big {
            grid-template-columns: repeat(2, 1fr)
        }

        .news {
            display: grid;
            gap: 8px;
            text-align: left;
            width: 100%;
            cursor: pointer
        }

        .news.urg {
            border-left: 6px solid var(--r);
            background: linear-gradient(90deg, var(--lr), var(--c) 40%)
        }

        .news p,
        .card p {
            margin: 0;
            color: var(--m)
        }

        .meta {
            font-size: 13px;
            color: var(--m)
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 12px 0;
            border-bottom: 1px solid var(--bd)
        }

        .row:last-child {
            border: 0
        }

        .row b {
            text-align: right
        }

        .hl {
            display: flex;
            gap: 8px;
            overflow-x: auto
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 6;
            display: flex;
            background: var(--c);
            border-top: 1px solid var(--bd);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        .nav button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--m);
            min-height: 60px;
            border-top: 3px solid transparent
        }

        .nav button span {
            font-size: 22px
        }

        .nav .on {
            color: var(--pt);
            font-weight: 700;
            border-top-color: var(--p);
            background: var(--lp)
        }

        .nav .brand {
            display: none
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 0 16px;
            border-radius: 12px;
            border: 2px solid var(--bd);
            background: var(--c)
        }

        input:focus {
            border-color: var(--p);
            outline: 0
        }

        label {
            font-size: 13px;
            font-weight: 600;
            display: grid;
            gap: 4px;
            margin-bottom: 12px
        }

        .map {
            background: var(--c);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 8px
        }

        .rm {
            fill: var(--lp);
            stroke: var(--p);
            stroke-width: 1.5;
            cursor: pointer
        }

        .rm:hover {
            fill: #d8ccfb
        }

        .rm.sel {
            fill: var(--p)
        }

        .rm.cl {
            fill: var(--lr);
            stroke: var(--r)
        }

        .rt {
            font-size: 12px;
            font-weight: 700;
            fill: var(--t);
            pointer-events: none
        }

        .rs {
            font-size: 8px;
            fill: var(--m);
            pointer-events: none
        }

        .rm.sel+.rt,
        .rm.sel~.x {
            fill: #fff
        }

        .path {
            fill: none;
            stroke: var(--r);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 8 8;
            animation: d 1s linear infinite
        }

        @keyframes d {
            to {
                stroke-dashoffset: -16
            }
        }

        .ov {
            position: fixed;
            inset: 0;
            background: #0008;
            z-index: 20;
            display: flex;
            align-items: flex-end;
            justify-content: center
        }

        .sheet {
            background: var(--bg);
            width: 100%;
            max-width: 560px;
            max-height: 88%;
            overflow: auto;
            border-radius: 24px 24px 0 0;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            animation: in .2s
        }

        .sheet header {
            position: static;
            background: none;
            color: var(--t);
            padding: 0 0 8px
        }

        .n {
            display: flex;
            gap: 12px;
            width: 100%;
            text-align: left;
            align-items: flex-start
        }

        .n.unread {
            border-left: 6px solid var(--p)
        }

        .n.unread.red {
            border-left-color: var(--r)
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%);
            background: var(--dp);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 30;
            animation: in .2s
        }

        .empty {
            text-align: center;
            color: var(--m);
            padding: 24px
        }

        @media(min-width:900px) {
            .wrap {
                margin-left: 220px;
                max-width: none;
                padding: 0 0 32px
            }

            .wrap>* {
                max-width: 820px;
                margin-left: auto;
                margin-right: auto
            }

            header {
                max-width: none !important;
                background: var(--dp)
            }

            .nav {
                top: 0;
                right: auto;
                width: 220px;
                flex-direction: column;
                border-top: 0;
                border-right: 1px solid var(--bd);
                padding: 16px 8px;
                gap: 4px
            }

            .nav button {
                flex: none;
                flex-direction: row;
                gap: 12px;
                justify-content: flex-start;
                padding: 0 16px;
                border-radius: 12px;
                border-top: 0;
                font-size: 16px;
                min-height: 52px
            }

            .nav .brand {
                display: flex;
                font-weight: 800;
                font-size: 20px;
                color: var(--pt);
                margin-bottom: 16px;
                pointer-events: none
            }

            .grid {
                grid-template-columns: repeat(8, 1fr)
            }

            .grid.big {
                grid-template-columns: repeat(4, 1fr)
            }

            .toast {
                bottom: 32px
            }

            .ov {
                align-items: center
            }

            .sheet {
                border-radius: 24px
            }
        }
    </style>
</head>

<body>

    <script>

        const DAYS = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday' };
        const K = (t, e, n, r, b, p, ch) => ({ t, e, n, r, b, p, ch });
        const SCHS = {

                Tue: [K('09:00', '10:30', 'Probability & Statistics', '401', 'B', 'Dr. M. Sadykova'), K('11:00', '12:30', 'Databases', '102', 'A', 'Prof. L. Omarov')],
                Wed: [K('09:00', '10:30', 'Web Development', '304', 'A', 'Dr. A. Nurlan'), K('11:00', '12:30', 'Operating Systems', '215', 'A', 'Prof. J. Kim')],
                Thu: [K('09:00', '10:30', 'Web Development', '304', 'A', 'Dr. A. Nurlan'), K('11:00', '12:30', 'Operating Systems', '310', 'A', 'Prof. J. Kim', '215'), K('13:00', '14:30', 'Probability & Statistics', '401', 'B', 'Dr. M. Sadykova')],
                Fri: [K('10:00', '11:30', 'Probability & Statistics', '401', 'B', 'Dr. M. Sadykova'), K('12:00', '13:30', 'Project Seminar', '101', 'A', 'Dr. A. Nurlan')]
            },
            daniyar: {
                Mon: [K('09:00', '10:30', 'Machine Learning', '402', 'B', 'Prof. R. Aliyev'), K('11:00', '12:30', 'Cloud Computing', '205', 'B', 'Dr. T. Bekov')],
                Tue: [K('10:00', '11:30', 'Thesis Seminar', '201', 'A', 'Dr. A. Nurlan'), K('13:00', '14:30', 'Software Architecture', '101', 'A', 'Prof. J. Kim')],
                Wed: [K('09:00', '10:30', 'Machine Learning', '402', 'B', 'Prof. R. Aliyev'), K('11:00', '12:30', 'Software Architecture', '101', 'A', 'Prof. J. Kim')],
                Thu: [K('09:00', '10:30', 'Machine Learning', '402', 'B', 'Prof. R. Aliyev'), K('11:00', '12:30', 'Cloud Computing', '301', 'B', 'Dr. T. Bekov', '205'), K('13:30', '15:00', 'Thesis Seminar', '201', 'A', 'Dr. A. Nurlan')],
                Fri: [K('10:00', '11:30', 'Cloud Computing', '205', 'B', 'Dr. T. Bekov')]
            }
        }; let SCH = SCHS.ayan;
        const PERS = {
            ayan: { name: 'Ayan S.', email: 'ayan.student@university.edu', group: 'IT-2410', id: 'ST-2026-001', year: 2, age: 19, role: 'Early-year student', label: 'Primary persona', needs: 'fast timetable access, simple campus navigation, highlighted announcements, quick links.' },
            daniyar: { name: 'Daniyar K.', email: 'daniyar.student@university.edu', group: 'IT-2210', id: 'ST-2022-014', year: 4, age: 22, role: 'Senior student', label: 'Secondary persona', needs: 'efficiency, up-to-date info, visible schedule changes, fast services, no unnecessary steps.' }
        };
        const ALERT = { ayan: 1, daniyar: 6 };
        const TODAY = 'Thu', NOW = '10:30';
        const ROOMS = [['101', 'A', 'Lecture Hall'], ['102', 'A', 'Computer Lab'], ['201', 'A', 'Seminar Room'], ['215', 'A', 'Lecture Room'], ['304', 'A', 'Web Lab'], ['310', 'A', 'Lecture Room'], ['401', 'B', 'Lecture Hall'], ['402', 'B', 'Seminar Room'], ['205', 'B', 'Physics Lab'], ['301', 'B', 'Study Room'], ['120', 'C', 'Student Services'], ['220', 'C', 'University Library'], ['110', 'C', 'Cafeteria']].map(([id, b, n]) => ({ id, b, n, cl: id === '215' }));
        const NEWS = [
            { id: 1, cat: 'Important', urg: 1, title: 'Room 215 is temporarily unavailable', d: 'Repairs in progress. Affected classes are moved to Room 310.', date: '1 Oct', body: 'Room 215 (Building A, 2nd floor) is closed for repairs until further notice. Operating Systems has been moved to Room 310 (Building A, 3rd floor). Check your schedule for other changes.', room: '310' },
            { id: 2, cat: 'Events', title: 'Student Science Week starts October 12', d: 'Talks, lab tours and a student project expo.', date: '28 Sep', body: 'Student Science Week runs October 12–16 across Buildings A and B. Join open lab tours, guest talks and the student project expo. Registration is open at the Student Services office.' },
            { id: 3, cat: 'Academic', title: 'University library working hours updated', d: 'The library now opens at 08:00 on weekdays.', date: '27 Sep', body: 'From October 1 the University Library (Building C) is open Mon–Fri 08:00–21:00 and Sat 10:00–16:00. Study rooms can be booked at the front desk.' },
            { id: 4, cat: 'Important', title: 'Midterm exam schedule published', d: 'Midterms run October 20–31. Check your group timetable.', date: '26 Sep', body: 'The midterm exam schedule is now available in the Student Portal. Bring your student ID. Retake requests must be filed 3 days before the exam.' },
            { id: 5, cat: 'Events', title: 'Career Fair: 40 companies on campus', d: 'Meet employers in Building B on October 8.', date: '25 Sep', body: 'Career Fair takes place October 8, 10:00–16:00, in Building B (ground floor). Bring your CV. Workshops on interviews run every hour.' },
            { id: 6, cat: 'Important', urg: 1, title: 'Thesis defence schedule published; Room 205 reserved', d: 'Cloud Computing moved to Room 301. Check your defence slot.', date: '1 Oct', body: 'Room 205 is reserved for thesis pre-defences this week. Cloud Computing (Thu 11:00) moves to Room 301, Building B, 3rd floor. Final defence slots are published in the Student Portal.', room: '301' }];
        const SVC = [
            { id: 'portal', i: '🎓', n: 'Student Portal', d: 'Grades, payments and official documents.', x: [['GPA', '3.62'], ['Credits', '48 / 240'], ['Next payment', 'Nov 15']] },
            { id: 'platonus', i: '📘', n: 'Platonus', d: 'Course materials, assignments and e-journal.', x: [['Open assignments', '3'], ['New grades', '1']] },
            { id: 'email', i: '✉️', n: 'University Email', d: 'Your university mailbox.', x: [['Address', 'ayan.student@university.edu'], ['Unread', '4']] },
            { id: 'library', i: '📚', n: 'University Library', d: 'Catalogue, e-books and study room booking. Building C.', x: [['Hours', '08:00–21:00'], ['Borrowed', '2 books']] },
            { id: 'calendar', i: '🗓️', n: 'Academic Calendar', d: 'Semester dates, exams and holidays.', x: [['Midterms', 'Oct 20–31'], ['Winter break', 'Dec 25']] },
            { id: 'contacts', i: '☎️', n: 'Contacts', d: 'Departments and staff directory.', x: [['Dean’s office', '+7 700 000 0001'], ['IT support', '+7 700 000 0002']] },
            { id: 'tuition', i: '💳', n: 'Tuition Information', d: 'Fees, invoices and payment options.', x: [['Balance', '0 ₸'], ['Next invoice', 'Nov 15']] },
            { id: 'support', i: '🤝', n: 'Student Services', d: 'Certificates, dormitory and counselling. Building C, Room 120.', x: [['Office hours', '09:00–17:00']] }];
        const S = {
            view: 'home', hist: [], day: TODAY, sel: null, route: 0, bld: 'A', mq: '', nf: 'All', nid: null, q: '', notif: 0, srch: 0, modal: null, toast: '',
            who: 'ayan', prof: { ...PERS.ayan }, guide: 0, step: -1,
            N: [{ id: 1, i: '🔴', red: 1, t: 'Room changed', d: 'Operating Systems moved from Room 215 to Room 310.', u: 1 }, { id: 2, i: '🟣', t: 'New announcement', d: 'Student Science Week information is now available.', u: 1 }, { id: 3, i: '⚪', t: 'Reminder', d: 'Your next class starts in 30 minutes.', u: 1 }]
        };
        const N0 = { ayan: JSON.stringify(S.N), daniyar: JSON.stringify([{ id: 1, i: '🔴', red: 1, t: 'Schedule updated', d: 'Cloud Computing moved from Room 205 to Room 301.', u: 1 }, { id: 2, i: '🟣', t: 'Important announcement', d: 'Thesis defence schedule is now available.', u: 1 }, { id: 3, i: '⚪', t: 'Reminder', d: 'Your next class starts in 30 minutes.', u: 1 }]) };
        const $ = document.getElementById('app'), ord = n => ['1st', '2nd', '3rd', '4th'][n - 1] || n + 'th', fl = r => ord(+r.id[0]), rm = id => ROOMS.find(r => r.id === id), sv = id => SVC.find(s => s.id === id);
        const unread = () => S.N.filter(n => n.u).length;
        function classCard(c, day, i) {
            const st = day === TODAY ? (c.e <= NOW ? 'done' : (c.t > NOW && !SCH[day].some((x, j) => j < i && x.t > NOW) ? 'next' : '')) : '';
            return `<div class="card cls ${c.ch ? 'chg' : ''} ${st}" data-a="cls:${day}:${i}" role="button" tabindex="0" aria-label="${c.n}, ${c.t}, room ${c.r}">
<div class="tm">${c.t}<small>${c.e}</small></div><div style="flex:1;display:grid;gap:4px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h3>${c.n}</h3>${c.ch ? '<span class="tag">⚠ ROOM CHANGED</span>' : ''}${st === 'next' ? '<span class="tag p">NEXT</span>' : ''}${st === 'done' ? '<span class="tag g">DONE</span>' : ''}</div>
<span class="meta">${c.p}</span>
${c.ch ? `<div style="color:var(--r);font-weight:700">Room changed: <s>${c.ch}</s> → ${c.r}</div>` : ''}
<div><button class="chip sm" data-a="room:${c.r}" aria-label="Show room ${c.r} on map">📍 Room ${c.r} · Building ${c.b}</button></div></div></div>`
        }
        const newsCard = n => `<button class="card news ${n.urg ? 'urg' : ''}" data-a="news:${n.id}"><div style="display:flex;gap:8px;align-items:center">${n.urg ? '<span class="tag">URGENT</span>' : `<span class="tag g">${n.cat.toUpperCase()}</span>`}<span class="meta">${n.date}</span></div><h3>${n.title}</h3><p>${n.d}</p><span class="link" style="padding:0">Read more →</span></button>`;
        const svcBtn = s => `<button class="svc" data-a="svc:${s.id}"><span>${s.i}</span>${s.n}</button>`;
        function home() {
            const t = SCH[TODAY], nx = t.find(c => c.t > NOW), urg = NEWS.find(n => n.id === ALERT[S.who]);
            return `<div><h2 style="font-size:24px">Good morning, ${S.prof.name.split(' ')[0]} 👋</h2><p class="meta" style="margin:0">Thursday, 1 October</p></div>
${nx ? `<div class="card hero cls" data-a="cls:${TODAY}:${t.indexOf(nx)}" role="button" tabindex="0"><div class="tm">${nx.t}<small>NEXT UP</small></div><div style="display:grid;gap:4px"><h3 style="font-size:20px">${nx.n}</h3><span>Room ${nx.r} · Building ${nx.b}</span>${nx.ch ? `<span class="tag" style="justify-self:start">⚠ ROOM CHANGED ${nx.ch} → ${nx.r}</span>` : ''}</div></div>` : ''}
<section style="display:grid;gap:8px"><div class="sec"><h2>Today’s schedule</h2><button class="link" data-a="tab:schedule">View full schedule</button></div>${t.map((c, i) => classCard(c, TODAY, i)).join('')}</section>
<section style="display:grid;gap:8px"><div class="sec"><h2>Important</h2><button class="link" data-a="tab:news">All news</button></div><button class="card alert" data-a="news:${urg.id}"><span style="font-size:28px">🚨</span><span><span class="tag">URGENT</span><br><b>${urg.title}</b><br><span class="meta" style="color:var(--t)">${urg.d}</span></span></button></section>
<section style="display:grid;gap:8px"><div class="sec"><h2>Quick services</h2><button class="link" data-a="push:services">All services</button></div><div class="grid">${(S.who === 'daniyar' ? SVC : SVC.slice(0, 4)).map(svcBtn).join('')}</div></section>
<section class="card" style="display:flex;gap:16px;align-items:center"><span style="font-size:32px">🗺️</span><div style="flex:1"><h3>Campus map</h3><p>${S.who === 'daniyar' ? 'Unfamiliar room? Search it here.' : 'Find any classroom fast. Tap a room for a route.'}</p></div><button class="btn" style="width:auto" data-a="tab:map">Open map</button></section>`
        }
        function schedule() {
            const l = SCH[S.day]; return `<div class="hl" role="tablist">${Object.keys(DAYS).map(d => `<button class="chip ${d === S.day ? 'on' : ''}" role="tab" aria-selected="${d === S.day}" data-a="day:${d}">${d}${d === TODAY ? ' •' : ''}</button>`).join('')}</div>
<div class="sec"><h2>${DAYS[S.day]}${S.day === TODAY ? ' (today)' : ''}</h2><span class="meta">${l.length} classes</span></div>
${l.some(c => c.ch) ? '<div class="card" style="border:2px solid var(--r);background:var(--lr)">⚠ <b>1 change</b> this day — see items marked ROOM CHANGED.</div>' : ''}
${l.map((c, i) => classCard(c, S.day, i)).join('')}`
        }
        function mapV() {
            const b = S.bld, rs = ROOMS.filter(r => r.b === b), h = Math.ceil(rs.length / 2), sel = S.sel && rm(S.sel), res = S.mq ? ROOMS.filter(r => (r.id + ' room ' + r.id + ' building ' + r.b + ' ' + r.n).toLowerCase().includes(S.mq.toLowerCase())).slice(0, 5) : [];
            let p = '', tiles = rs.map((r, i) => {
                const col = i < h ? 0 : 1, row = i < h ? i : i - h, x = col ? 190 : 20, y = 14 + row * 56;
                if (S.route && sel && sel.id === r.id) p = `<path class="path" d="M150 214L150 ${y + 22}L${col ? 190 : 110} ${y + 22}"/>`;
                return `<g data-a="room:${r.id}" role="button" tabindex="0" aria-label="Room ${r.id}"><rect class="rm ${sel && sel.id === r.id ? 'sel' : ''} ${r.cl ? 'cl' : ''}" x="${x}" y="${y}" width="90" height="46" rx="8"/><text class="rt" x="${x + 8}" y="${y + 21}" ${sel && sel.id === r.id ? 'fill="#fff" style="fill:#fff"' : ''}>${r.id}${r.cl ? ' ✕' : ''}</text><text class="rs" x="${x + 8}" y="${y + 36}" ${sel && sel.id === r.id ? 'style="fill:#fff"' : ''}>${r.n}</text></g>`
            }).join('');
            return `<input id="mq" placeholder="Search a room, e.g. 304" aria-label="Search room" value="${S.mq}" autocomplete="off">
${S.mq ? `<div class="card">${res.length ? res.map(r => `<button class="row" style="width:100%" data-a="room:${r.id}"><span>📍 <b>Room ${r.id}</b> · ${r.n}</span><span class="meta">Building ${r.b}</span></button>`).join('') : '<div class="empty">No rooms found</div>'}</div>` : ''}
<div class="hl">${['A', 'B', 'C'].map(x => `<button class="chip ${x === b ? 'on' : ''}" data-a="bld:${x}">Building ${x}</button>`).join('')}</div>
<div class="map"><svg viewBox="0 0 300 232" width="100%" role="img" aria-label="Building ${b} floor plan"><rect x="110" y="6" width="80" height="204" fill="var(--bd)" opacity=".5" rx="6"/><text x="150" y="108" text-anchor="middle" class="rs" transform="rotate(-90 150 108)">CORRIDOR</text>${tiles}${p}<circle cx="150" cy="216" r="7" fill="#5B21B6" stroke="#fff" stroke-width="2"/><text x="150" y="230" text-anchor="middle" class="rs" style="font-weight:700">YOU ARE HERE (entrance)</text></svg></div>
${sel ? `<div class="card" style="display:grid;gap:12px;border:2px solid var(--p)"><div class="sec"><div><h2>Room ${sel.id}</h2><p>${sel.n} · Building ${sel.b} · ${fl(sel)} floor</p></div>${sel.cl ? '<span class="tag">CLOSED</span>' : ''}</div>
${S.route ? `<div style="color:var(--pt);font-weight:600">🧭 Route: entrance of Building ${sel.b} → straight along the corridor → ${sel.id[0] === '1' ? 'ground level' : 'stairs to floor ' + sel.id[0]} → Room ${sel.id} on your ${+sel.id.slice(1) % 2 ? 'left' : 'right'}. ≈ ${1 + +sel.id[0]} min walk.</div>` : ''}
<div style="display:flex;gap:8px"><button class="btn" data-a="route">${S.route ? 'Hide route' : 'Show route'}</button><button class="btn o" data-a="clear">Clear</button></div></div>` : `<div class="card empty">Tap a room or search to see its location and route.</div>`}`
        }
        function newsV() {
            const l = NEWS.filter(n => S.nf === 'All' || n.cat === S.nf).sort((a, b) => (b.id === ALERT[S.who]) - (a.id === ALERT[S.who]));
            return `<div class="hl">${['All', 'Important', 'Events', 'Academic'].map(f => `<button class="chip ${f === S.nf ? 'on' : ''}" data-a="nf:${f}">${f.toUpperCase()}</button>`).join('')}</div>${l.length ? l.map(newsCard).join('') : '<div class="empty">Nothing here.</div>'}`
        }
        function detail() { const n = NEWS.find(x => x.id === S.nid); return `<article class="card" style="display:grid;gap:12px">${n.urg ? '<span class="tag" style="justify-self:start">URGENT</span>' : `<span class="tag g" style="justify-self:start">${n.cat.toUpperCase()}</span>`}<h2 style="font-size:22px">${n.title}</h2><span class="meta">${n.date} 2026</span><p style="color:var(--t)">${n.body}</p>${n.room ? `<button class="btn" data-a="room:${n.room}">📍 Show Room ${n.room} on map</button>` : ''}<button class="btn o" data-a="back">Back to news</button></article>` }
        function servicesV() { return `<div class="grid big">${SVC.map(svcBtn).join('')}</div>` }
        function profile() {
            const P = S.prof; return `<div class="card" style="text-align:center;display:grid;gap:4px;justify-items:center"><div style="width:72px;height:72px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700">${P.name[0]}</div><h2>${P.name}</h2><p>${P.role} · Information Systems</p><button class="btn" style="width:auto" data-a="edit">✏️ Edit profile</button></div>
<div class="card"><h3>Personal information</h3><div class="row"><span>Name</span><b>${P.name}</b></div><div class="row"><span>Email</span><b>${P.email}</b></div></div>
<div class="card"><h3>Academic information</h3><div class="row"><span>Student ID</span><b>${P.id}</b></div><div class="row"><span>Program</span><b>Information Systems</b></div><div class="row"><span>Year</span><b>${P.year}</b></div><div class="row"><span>Group</span><b>${P.group}</b></div></div>
<div class="card"><div class="sec"><h3>University services</h3><button class="link" data-a="push:services">All</button></div><div class="hl" style="flex-wrap:wrap">${SVC.slice(0, 5).map(s => `<button class="chip" data-a="svc:${s.id}">${s.i} ${s.n}</button>`).join('')}</div></div>`
        }
        function results() {
            const q = S.q.trim().toLowerCase(); if (!q) return '<div class="empty">Search rooms, subjects, news and services.</div>'; const R = [], has = s => s.toLowerCase().includes(q);
            ROOMS.filter(r => has('room ' + r.id + ' ' + r.n + ' building ' + r.b)).forEach(r => R.push(['📍', 'Room ' + r.id, `${r.n} · Building ${r.b}`, 'Room', 'room:' + r.id]));
            const seen = {}; Object.entries(SCH).forEach(([d, l]) => l.forEach(c => { if ((has(c.n) || has(c.r) || has(c.p)) && !seen[c.n + d]) seen[c.n + d] = R.push(['📅', c.n, `${DAYS[d]} ${c.t} · Room ${c.r} · Building ${c.b}`, 'Subject', 'day:' + d]) }));
            NEWS.filter(n => has(n.title + n.d)).forEach(n => R.push(['📰', n.title, n.date, 'News', 'news:' + n.id]));
            SVC.filter(s => has(s.n + s.d)).forEach(s => R.push([s.i, s.n, 'Quick Service', 'Service', 'svc:' + s.id]));
            return R.length ? R.map(r => `<button class="card n" style="margin-bottom:8px;min-height:64px" data-a="${r[4]}"><span style="font-size:24px">${r[0]}</span><span style="flex:1"><b>${r[1]}</b><br><span class="meta">${r[2]}</span></span><span class="tag g">${r[3]}</span></button>`).join('') : '<div class="empty">No results for “' + S.q + '”</div>'
        }
        function modal() { const m = S.modal; if (!m) return ''; return `<div class="ov" data-a="close"><div class="sheet" role="dialog" aria-modal="true" data-stop="1"><header><h1 style="color:var(--t)">${m.title}</h1><button class="ib" style="color:var(--t)" data-a="close" aria-label="Close">✕</button></header>${m.html}</div></div>` }
        const TITLES = { home: 'Campus+', schedule: 'Schedule', map: 'Campus map', news: 'News & announcements', profile: 'Profile', detail: 'Announcement', services: 'Quick services' };
        function render() {
            const v = S.view, tabs = [['home', '🏠', 'Home'], ['schedule', '📅', 'Schedule'], ['map', '🗺️', 'Map'], ['news', '📰', 'News'], ['profile', '👤', 'Profile']], body = { home, schedule, map: mapV, news: newsV, profile, detail, services: servicesV }[v]();
            const u = unread();
            $.innerHTML = `<nav class="nav" aria-label="Main"><div class="brand">${logo(32)}&nbsp;Campus+</div>${tabs.map(([k, i, l]) => `<button class="${v === k || (v === 'detail' && k === 'news') ? 'on' : ''}" data-a="tab:${k}" ${v === k ? 'aria-current="page"' : ''}><span>${i}</span>${l}</button>`).join('')}</nav>
<div class="wrap"><header>${S.hist.length ? '<button class="ib" data-a="back" aria-label="Back">←</button>' : ''}<h1>${v === 'home' && !S.hist.length ? logo(32) : ''}<span>${TITLES[v]}<small>${v === 'home' ? S.prof.name + ' · Student' : 'Campus+'}</small></span></h1><button class="ib" data-a="search" aria-label="Search">🔍</button><button class="ib" data-a="notif" aria-label="Notifications, ${u} unread">🔔${u ? `<span class="badge">${u}</span>` : ''}</button></header>${demoBar()}<main>${body}</main></div>
${S.srch ? `<div class="ov" data-a="close"><div class="sheet" data-stop="1" style="min-height:60%"><header><input id="gq" placeholder="Search rooms, subjects, news, services" aria-label="Global search" value="${S.q}" autocomplete="off"><button class="ib" style="color:var(--t)" data-a="close" aria-label="Close">✕</button></header><div id="res">${results()}</div></div></div>` : ''}
${S.notif ? `<div class="ov" data-a="close"><div class="sheet" data-stop="1"><header><h1 style="color:var(--t)">Notifications</h1><button class="link" data-a="readall">Mark all read</button><button class="ib" style="color:var(--t)" data-a="close" aria-label="Close">✕</button></header><div style="display:grid;gap:8px">${S.N.map(n => `<button class="card n ${n.u ? 'unread' : ''} ${n.red ? 'red' : ''}" data-a="rn:${n.id}"><span style="font-size:20px">${n.i}</span><span style="flex:1"><b>${n.t}</b>${n.u ? ' <span class="tag p">NEW</span>' : ''}<br><span class="meta">${n.d}</span></span></button>`).join('')}</div></div></div>` : ''}
${modal()}${S.toast ? `<div class="toast" role="status">${S.toast}</div>` : ''}`;
            const f = S.focus; if (f) { const e = document.getElementById(f); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length) } }
        }
        const STEPS = {
            ayan: [
                ['Home', 'tab:home', 'Ayan sees today’s timetable first; Operating Systems carries a red ROOM CHANGED label (not colour alone).'],
                ['Schedule', 'tab:schedule', 'One tap opens the weekly timetable; the change 215 → 310 is clearly marked.'],
                ['Room 310', 'room:310', 'Tapping the room opens the map with Room 310 highlighted — no searching for a newcomer.'],
                ['Route', 'roomr:310', '“Show route” draws the path from “You are here” to the room.'],
                ['Home', 'tab:home', 'Bottom navigation: Home is always one tap away.'],
                ['News', 'tab:news', 'The urgent announcement is visually separated in red.'],
                ['Portal', 'svc:portal', 'Student Portal is reachable straight from Home services.'],
                ['Profile', 'tab:profile', 'Profile: personal, academic and service info, easy to scan.']],
            daniyar: [
                ['Open app', 'tab:home', 'Daniyar opens Campus+; today’s timetable is already on Home — no navigation.'],
                ['Check schedule', 'cls:Thu:1', 'He checks the changed class: Cloud Computing, Room 205 → 301, marked ROOM CHANGED.'],
                ['Update alert', 'notif', 'The bell badge and red alert tell him about the important update immediately.'],
                ['News', 'tab:news', 'One tap on the News tab.'],
                ['IMPORTANT', 'nfx:Important', 'He filters to IMPORTANT only — noise removed.'],
                ['See it', 'nfx:Important', 'The thesis-defence announcement is listed first with a red URGENT tag.'],
                ['Details', 'news:6', 'The detail view explains the change and links straight to the room on the map.'],
                ['Home', 'tab:home', 'He returns Home with one tap on the bottom nav.'],
                ['Services', 'tab:home', 'All 8 services are visible on Home for Daniyar — zero extra navigation.'],
                ['Portal', 'svc:portal', 'Student Portal opens in one tap from Home.'],
                ['Map', 'roomr:301', 'He needs the unfamiliar Room 301: map search/tap plus route, only when needed.']]
        };
        function setWho(w) { S.who = w; S.prof = { ...PERS[w] }; SCH = SCHS[w]; S.N = JSON.parse(N0[w]); S.hist = []; S.view = 'home'; S.day = TODAY; S.nf = 'All'; S.sel = null; S.route = 0; S.mq = ''; S.nid = null; S.guide = 1; S.step = -1; closeAll(); window.scrollTo(0, 0) }
        function demoBar() {
            const P = PERS[S.who], st = STEPS[S.who], cur = st[S.step];
            return `<div style="padding:8px 16px 0;display:grid;gap:8px"><div class="card" style="padding:8px 12px;border-style:dashed;display:flex;gap:4px;align-items:center;flex-wrap:wrap"><span class="tag g">DEMO</span>${['ayan', 'daniyar'].map(w => `<button class="chip sm ${S.who === w ? 'on' : ''}" data-a="who:${w}" aria-pressed="${S.who === w}">${PERS[w].name} · ${PERS[w].label.split(' ')[0]}</button>`).join('')}<button class="link" data-a="guide">${S.guide ? 'Hide' : 'Show'} scenario</button></div>
${S.guide ? `<div class="card" style="display:grid;gap:8px;border:2px solid var(--p)"><div><b>${P.name}, ${P.age} — ${P.role}</b> <span class="tag p">${P.label.toUpperCase()}</span><p>Needs: ${P.needs}</p></div><div class="hl" style="flex-wrap:wrap">${st.map((x, i) => `<button class="chip sm ${i === S.step ? 'on' : ''}" data-a="st:${i}">${i + 1}. ${x[0]}</button>`).join('')}</div><p style="color:var(--t)">${cur ? `<b>Step ${S.step + 1}:</b> ${cur[2]}` : 'Tap the steps in order to run the scenario.'}</p></div>` : ''}</div>`
        }
        function toast(m) { S.toast = m; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render() }, 2200) }
        function push(v) { if (S.view !== v) S.hist.push(S.view); S.view = v; window.scrollTo(0, 0) }
        function closeAll() { S.srch = 0; S.notif = 0; S.modal = null; S.focus = null }
        function act(a) {
            const [k, x, y] = a.split(':');
            if (k === 'tab') { closeAll(); S.hist = []; S.view = x; window.scrollTo(0, 0) }
            else if (k === 'push') { closeAll(); push(x) }
            else if (k === 'back') { S.view = S.hist.pop() || 'home' }
            else if (k === 'day') S.day = x, (S.srch && (closeAll(), push('schedule')), S.view !== 'schedule' && push('schedule'), S.day = x);
            else if (k === 'room') { closeAll(); S.sel = x; S.bld = rm(x).b; S.route = 0; S.mq = ''; push('map') }
            else if (k === 'route') S.route = !S.route;
            else if (k === 'who') setWho(x);
            else if (k === 'guide') S.guide = !S.guide;
            else if (k === 'nfx') { closeAll(); S.nf = x; S.hist = []; S.view = 'news' }
            else if (k === 'roomr') { act('room:' + x); S.route = 1; render(); return }
            else if (k === 'st') { S.step = +x; S.guide = 1; act(STEPS[S.who][+x][1]); return }
            else if (k === 'clear') { S.sel = null; S.route = 0 }
            else if (k === 'bld') S.bld = x;
            else if (k === 'nf') S.nf = x;
            else if (k === 'news') { closeAll(); S.nid = +x; push('detail') }
            else if (k === 'cls') { const c = SCH[x][+y], s = c.ch; S.modal = { title: c.n, html: `<div class="card" style="display:grid;gap:8px"><div class="row"><span>Time</span><b>${c.t} – ${c.e}</b></div><div class="row"><span>Teacher</span><b>${c.p}</b></div><div class="row"><span>Room</span><b>${c.r} (Building ${c.b})</b></div>${s ? `<div style="color:var(--r);font-weight:700">⚠ ROOM CHANGED: ${s} → ${c.r}</div>` : ''}<button class="btn" data-a="room:${c.r}">📍 Show Room ${c.r} on map</button></div>` } }
            else if (k === 'svc') { const s = sv(x); S.modal = { title: s.i + ' ' + s.n, html: `<div class="card"><p style="margin-bottom:8px">${s.d}</p>${s.x.map(r => `<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}<br><button class="btn" data-a="open:${s.id}">Open ${s.n}</button></div>` }; S.srch = 0 }
            else if (k === 'open') { S.modal = null; return toast('Opening ' + sv(x).n + ' (prototype)…') }
            else if (k === 'close') closeAll();
            else if (k === 'search') { closeAll(); S.srch = 1; S.q = ''; S.focus = 'gq' }
            else if (k === 'notif') { closeAll(); S.notif = 1 }
            else if (k === 'readall') S.N.forEach(n => n.u = 0);
            else if (k === 'rn') { const n = S.N.find(n => n.id == x); n.u = 0 }
            else if (k === 'edit') S.modal = { title: 'Edit profile', html: `<div class="card"><label>Name<input id="pn" value="${S.prof.name}"></label><label>Email<input id="pe" value="${S.prof.email}"></label><label>Group<input id="pg" value="${S.prof.group}"></label><button class="btn" data-a="save">Save changes</button></div>` };
            else if (k === 'save') { S.prof = { ...S.prof, name: pn.value || S.prof.name, email: pe.value || S.prof.email, group: pg.value || S.prof.group }; S.modal = null; return toast('Profile updated ✓') }
            render()
        }
        document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; if (el.dataset.a === 'close' && e.target.closest('[data-stop]') && !e.target.closest('button[data-a="close"]')) return; if (el.hasAttribute('data-stop')) return; act(el.dataset.a) });
        document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); act(e.target.dataset.a) } if (e.key === 'Escape') { closeAll(); render() } });
        document.addEventListener('input', e => { if (e.target.id === 'mq') { S.mq = e.target.value; S.focus = 'mq'; render() } if (e.target.id === 'gq') { S.q = e.target.value; document.getElementById('res').innerHTML = results() } });
        render();
    </script>
</body>

</html>
